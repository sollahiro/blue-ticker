<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLT-58 Overview mock</title>
  <style>
    :root {
      --shell: #08080a;
      --card: #212426;
      --control: #141416;
      --text: #fafafc;
      --muted: #b3b8bf;
      --accent: #59b2f2;
      --page: #12141a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      background: var(--page);
      color: var(--text);
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 48px;
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 28px;
      align-items: start;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.03em; }
    .lede { color: var(--muted); margin: 0 0 16px; line-height: 1.55; }
    .panel {
      background: #1a1c22;
      border: 1px solid #2a2e38;
      border-radius: 16px;
      padding: 16px 18px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
    .chips button {
      border: 1px solid #3a404c;
      background: var(--control);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .chips button[aria-pressed="true"] {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .toggles { display: flex; gap: 10px; margin-bottom: 14px; }
    .toggles button {
      flex: 1;
      border: 1px solid #3a404c;
      background: var(--control);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
    }
    .toggles button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
    .phone {
      width: 390px;
      background: var(--shell);
      border-radius: 36px;
      padding: 12px 0 20px;
      box-shadow: 0 24px 60px rgb(0 0 0 / 45%);
      overflow: hidden;
    }
    .status {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 0 8px;
    }
    .nav {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 0 12px 8px;
    }
    .nav .mark {
      width: 28px; height: 28px; margin: 0 auto; border-radius: 7px;
      background: linear-gradient(135deg, #7ec8f5, #3a8fd0);
    }
    .back { color: var(--text); font-size: 20px; padding-left: 4px; }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 8px;
    }
    .icon {
      width: 38px; height: 38px; border-radius: 6px; background: #3a3d42;
      flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700;
      color: var(--muted);
    }
    .names { min-width: 0; flex: 1; }
    .names strong { display: block; font-size: 17px; }
    .names span { color: var(--muted); font-size: 14px; }
    .names .overview {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }
    .names .overview.empty { font-style: normal; opacity: .7; }
    .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .sector {
      font-size: 10px; font-weight: 700; color: #fff;
      padding: 2px 6px; border-radius: 4px;
    }
    .watch {
      font-size: 12px; font-weight: 600;
      background: var(--accent); color: #000;
      border: 0; border-radius: 4px; padding: 6px 10px;
    }
    .card {
      margin: 12px 16px 0;
      background: var(--card);
      border-radius: 12px;
      min-height: 280px;
      padding: 12px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 6px 6px; text-align: right; }
    th:first-child, td:first-child { text-align: left; color: var(--muted); }
    .dots { display: flex; justify-content: center; gap: 10px; padding: 12px 0 0; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: #6b7178; display: block; }
    .dots i.current { width: 10px; height: 10px; background: var(--accent); }
    .meta dt { color: var(--muted); font-size: 12px; margin-top: 10px; }
    .meta dd { margin: 4px 0 0; }
    .findings { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.55; }
    code { font-size: 12px; color: #c9d4e8; }
    .cost { font-variant-numeric: tabular-nums; }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="phone" id="phone">
        <div class="status">9:41</div>
        <div class="nav"><div class="back">‹</div><div class="mark" title="Blue Ticker"></div><div></div></div>
        <div class="header">
          <div class="icon" id="icon" aria-hidden="true"></div>
          <div class="names">
            <strong id="name">—</strong>
            <span id="code">—</span>
            <div class="overview" id="overview"></div>
          </div>
          <div class="side">
            <span class="sector" id="sector"></span>
            <button class="watch" type="button">リストに追加</button>
          </div>
        </div>
        <div class="card">
          <table>
            <thead>
              <tr><th></th><th>23/3</th><th>24/3</th><th>25/3</th></tr>
            </thead>
            <tbody>
              <tr><td>売上高</td><td>—</td><td>—</td><td>—</td></tr>
              <tr><td>粗利率（％）</td><td>—</td><td>—</td><td>—</td></tr>
              <tr><td>営業利益率（％）</td><td>—</td><td>—</td><td>—</td></tr>
            </tbody>
          </table>
          <p style="margin:10px 0 0;color:#8b9098;font-size:11px;">表は概要カードの置き場だけ。数値は出さない。Overview に金額を混ぜない。</p>
        </div>
        <div class="dots"><i class="current"></i><i></i><i></i><i></i></div>
      </div>
    </section>
    <section>
      <h1>Overview mock</h1>
      <p class="lede">
        BLT-58 の品質・コスト・置き場スパイク。公開 REST / ingest / iOS 製品面には載せない。
        入力は既存 Filing の <code>management_policy</code>。生成は OpenRouter。
      </p>
      <div class="toggles">
        <button type="button" id="mode-mock" aria-pressed="true">生成結果</button>
        <button type="button" id="mode-empty" aria-pressed="false">製品の今（空枠）</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="panel meta">
        <dt>モデル / 1社コスト / 上場4000社概算</dt>
        <dd class="cost" id="cost">—</dd>
        <dt>字数</dt>
        <dd id="chars">—</dd>
        <dt>入力</dt>
        <dd id="input-meta">—</dd>
        <dt>見つけたこと</dt>
        <dd><ul class="findings" id="findings"></ul></dd>
      </div>
    </section>
  </main>
  <script>
    const SECTOR_COLOR = {
      "輸送用機器": "#5a6b3a",
      "銀行業": "#3d4a6b",
      "電気機器": "#387a9e",
      "食料品": "#386bb8",
      "化学": "#388c9e",
      "サービス業": "#5984ad",
    };

    let payload = null;
    let selected = null;
    let showGenerated = true;

    function render() {
      const company = payload.companies.find(item => item.code === selected) || payload.companies[0];
      document.getElementById("name").textContent = company.display_name;
      document.getElementById("code").textContent = company.code;
      const sector = document.getElementById("sector");
      sector.textContent = company.sector;
      sector.style.background = SECTOR_COLOR[company.sector] || "#4a5560";
      const overview = document.getElementById("overview");
      const filled = showGenerated && company.applicable && company.overview;
      if (filled) {
        overview.textContent = company.overview;
        overview.classList.remove("empty");
      } else {
        overview.textContent = "会社説明はまだありません";
        overview.classList.add("empty");
      }
      document.getElementById("chars").textContent = filled
        ? `${company.char_count} 字（目標 ${payload.char_range[0]}〜${payload.char_range[1]}）`
        : "空枠（格納 Overview が無い間の製品面）";
      document.getElementById("input-meta").textContent =
        `${company.input_key} / ${company.doc_id} / 入力 ${company.input_chars_used} 字`
        + (company.input_thin ? " / 薄い入力" : "")
        + (company.applicable ? "" : ` / ${company.reason}`);
      document.getElementById("icon").textContent = (company.display_name || "?").slice(0, 1);
      for (const button of document.querySelectorAll("#chips button")) {
        button.setAttribute("aria-pressed", String(button.dataset.code === company.code));
      }
    }

    function usd(value) {
      return `$${Number(value).toFixed(value < 0.01 ? 6 : 2)}`;
    }

    async function initialize() {
      const response = await fetch("./overview_mock_expected.json");
      payload = await response.json();
      selected = payload.companies[0].code;
      const chips = document.getElementById("chips");
      for (const company of payload.companies) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.code = company.code;
        button.textContent = `${company.code} ${company.display_name}`;
        button.addEventListener("click", () => { selected = company.code; render(); });
        chips.append(button);
      }
      document.getElementById("cost").textContent =
        `${payload.model} / 1社 ${usd(payload.cost.per_company_usd)} / ${payload.cost.assumed_listed_count}社 ${usd(payload.cost.universe_usd)}`;
      const findings = document.getElementById("findings");
      for (const item of payload.findings || []) {
        const li = document.createElement("li");
        li.textContent = item;
        findings.append(li);
      }
      document.getElementById("mode-mock").addEventListener("click", () => {
        showGenerated = true;
        document.getElementById("mode-mock").setAttribute("aria-pressed", "true");
        document.getElementById("mode-empty").setAttribute("aria-pressed", "false");
        render();
      });
      document.getElementById("mode-empty").addEventListener("click", () => {
        showGenerated = false;
        document.getElementById("mode-mock").setAttribute("aria-pressed", "false");
        document.getElementById("mode-empty").setAttribute("aria-pressed", "true");
        render();
      });
      render();
    }

    initialize();
  </script>
</body>
</html>
