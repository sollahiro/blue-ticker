<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sankey smoke prototype</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1240px; margin: 0 auto; padding: 32px 24px 48px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 36px); letter-spacing: -.03em; }
    .lede { margin: 8px 0 24px; color: #5d6678; }
    .toolbar, .panel {
      border: 1px solid #dfe5ef;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(31 46 77 / 7%);
    }
    .toolbar {
      display: flex;
      align-items: end;
      gap: 20px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    label { display: grid; gap: 6px; font-size: 12px; font-weight: 700; color: #697386; }
    select {
      min-width: 270px;
      padding: 9px 36px 9px 12px;
      border: 1px solid #cbd3df;
      border-radius: 9px;
      background: #fff;
      color: #172033;
      font: inherit;
    }
    .meta { margin-left: auto; text-align: right; }
    .meta strong { display: block; font-size: 18px; }
    .meta span { color: #697386; font-size: 12px; }
    .panel { overflow: hidden; }
    .axis-controls {
      display: grid;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #e7ebf2;
      background: #fbfcfe;
    }
    .axis-controls header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .axis-controls h2 { margin: 0; font-size: 14px; }
    .axis-controls small { color: #7a8497; }
    #axis-list { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 12px; }
    .axis-picker {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      background: #fff;
    }
    .axis-picker span {
      color: #697386;
      font-size: 12px;
      font-weight: 700;
    }
    .axis-picker select { width: 100%; min-width: 0; }
    .chart-wrap { overflow-x: auto; padding: 18px 12px 8px; }
    svg { display: block; min-width: 760px; width: 100%; height: auto; }
    .axis-title { font-size: 15px; font-weight: 750; fill: #1c2940; }
    .axis-total { font-size: 11px; fill: #778196; }
    .item-label { font-size: 11px; font-weight: 650; fill: #172033; pointer-events: none; }
    .item-value { font-size: 10px; fill: #667085; pointer-events: none; }
    .empty {
      padding: 80px 24px;
      text-align: center;
      color: #697386;
    }
    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 0;
      padding: 14px 20px 18px;
      color: #697386;
      font-size: 12px;
    }
    .notice::before { content: "ⓘ"; color: #3867d6; }
    .error { color: #a12626; }
    @media (max-width: 700px) {
      main { padding: 22px 12px 32px; }
      .toolbar { align-items: stretch; flex-direction: column; gap: 12px; }
      select { width: 100%; min-width: 0; }
      .meta { margin-left: 0; text-align: left; }
      #axis-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sankey smoke prototype</h1>
    <p class="lede">同じ合計値を地域別・事業別・PL構成など、選択した観点で分解します。</p>

    <section class="toolbar" aria-label="表示設定">
      <label>
        会社
        <select id="case-select"></select>
      </label>
      <label>
        深掘り
        <select id="flow-select"></select>
      </label>
      <div class="meta" id="case-meta" aria-live="polite"></div>
    </section>

    <section class="panel">
      <div class="axis-controls">
        <header>
          <h2 id="axis-control-title">右側の分解</h2>
          <small id="axis-control-help">左側は地域別、右側を選択</small>
        </header>
        <div id="axis-list"></div>
      </div>
      <div class="chart-wrap" id="chart" aria-live="polite">
        <div class="empty">JSONを読み込んでいます…</div>
      </div>
      <p class="notice" id="chart-notice">
        地域別と右側の内訳は売上高ハブにのみ接続します。開示されていない地域×事業の配賦は生成しません。
      </p>
    </section>
  </main>

  <script>
    const state = { cases: [], selected: null, flowMode: "assets", rightAxisMode: "business" };
    const colors = ["#4277e6", "#59a6a6", "#ef9b45", "#9b72cf", "#db6574", "#6f9f50"];
    const number = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 1 });
    const compactNumber = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 6 });

    function formatValue(value) {
      const absolute = Math.abs(value);
      if (absolute >= 1e12) return `${compactNumber.format(value / 1e12)}兆円`;
      if (absolute >= 1e8) return `${compactNumber.format(value / 1e8)}億円`;
      if (absolute >= 1e4) return `${compactNumber.format(value / 1e4)}万円`;
      return `${number.format(value)}円`;
    }

    function svgElement(name, attributes = {}) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    }

    function addText(svg, x, y, text, className, anchor = "start") {
      const node = svgElement("text", { x, y, class: className, "text-anchor": anchor });
      node.textContent = text;
      svg.appendChild(node);
      return node;
    }

    function renderAxisControls() {
      const list = document.querySelector("#axis-list");
      list.replaceChildren();
      const title = document.querySelector("#axis-control-title");
      const help = document.querySelector("#axis-control-help");
      const notice = document.querySelector("#chart-notice");
      if (state.flowMode !== "sales") {
        title.textContent = "表示する流れ";
        help.textContent = "会計上保存する単位ごとに独立したSankeyを表示";
        const labels = {
          assets: "資産 → 総資産 → 負債・純資産",
          equity: "期首資本・当期利益 → 資本変動 → 期末資本・配当・自己株式取得",
          rd: "研究開発費 → セグメント別研究開発費",
          gross_profit: "粗利益 → 販管費・研究開発費・営業利益",
          pretax_profit: "営業利益・営業外純益 → 税引前利益 → 税金・帰属差・純利益"
        };
        notice.textContent = state.flowMode === "equity"
          ? "純利益から配当・自己株式取得へ直接配賦せず、期首資本とともに資本変動ハブへ接続します。"
          : "各帯は同じ会計ブリッジ内で値が保存するよう、差額を明示して接続します。";
        const description = document.createElement("div");
        description.className = "axis-picker";
        const prefix = document.createElement("span");
        prefix.textContent = "表示";
        const value = document.createElement("strong");
        value.textContent = labels[state.flowMode] ?? "";
        description.append(prefix, value);
        list.append(description);
        return;
      }
      title.textContent = "右側の分解";
      help.textContent = "左側は地域別、右側を選択";
      notice.textContent = "地域別と右側の内訳は売上高ハブにのみ接続します。開示されていない地域×事業の配賦は生成しません。";
      const picker = document.createElement("label");
      picker.className = "axis-picker";
      const slot = document.createElement("span");
      slot.textContent = "右側の分解";
      const select = document.createElement("select");
      select.setAttribute("aria-label", "売上高の右側を分解する軸");
      [
        ["business", "事業別"],
        ["pl_gross", "PL構成（粗利益階層）"],
        ["pl_operating", "PL構成（営業利益階層）"]
      ].forEach(([id, label]) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = label;
        option.selected = id === state.rightAxisMode;
        select.append(option);
      });
      select.addEventListener("change", event => {
        state.rightAxisMode = event.target.value;
        render();
      });
      picker.append(slot, select);
      list.append(picker);
    }

    function buildFlow() {
      const axis = id => state.selected.axes.find(item => item.id === id);
      const metrics = state.selected.metrics ?? {};

      if (state.flowMode === "equity") {
        const total = metrics.opening_equity + metrics.net_profit;
        const otherDecrease = total - metrics.closing_equity - metrics.dividends - metrics.share_buyback;
        const inputs = [
          { id: "opening_equity", label: "期首資本", value: metrics.opening_equity, color: "#53627a" },
          { id: "net_profit", label: "当期純利益", value: metrics.net_profit, color: "#42a846" }
        ];
        const outputs = [
          { id: "closing_equity", label: "期末資本", value: metrics.closing_equity, color: "#53627a" },
          { id: "dividends", label: "配当金", value: metrics.dividends, color: "#d66a72" },
          { id: "share_buyback", label: "自己株式取得", value: metrics.share_buyback, color: "#ca4b58" },
          { id: "other_decrease", label: "その他資本減少", value: otherDecrease, color: "#e69273" }
        ];
        return {
          total,
          stages: [
            { label: "資本への流入", nodes: inputs },
            { label: "資本変動", nodes: [{ id: "equity_bridge", label: "資本変動", value: total, color: "#70648f" }] },
            { label: "資本の着地・流出", nodes: outputs }
          ],
          links: [
            ...inputs.map(item => ({ from: [0, item.id], to: [1, "equity_bridge"], value: item.value })),
            ...outputs.map(item => ({ from: [1, "equity_bridge"], to: [2, item.id], value: item.value }))
          ]
        };
      }

      if (state.flowMode === "rd") {
        const rd = axis("research_and_development");
        const totalNode = { id: "rd_total", label: "研究開発費", value: rd.total, color: "#53627a" };
        const segments = rd.items.map((item, index) => ({ ...item, color: colors[index % colors.length] }));
        return {
          total: rd.total,
          stages: [
            { label: "PL研究開発費", nodes: [totalNode] },
            { label: "セグメント別研究開発費", nodes: segments }
          ],
          links: segments.map(item => ({ from: [0, "rd_total"], to: [1, item.id], value: item.value }))
        };
      }

      if (state.flowMode === "gross_profit") {
        const outputs = [
          { id: "sga", label: "販売費及び一般管理費", value: metrics.sga, color: "#d66a72" },
          { id: "rd", label: "研究開発費", value: metrics.research_and_development, color: "#e69273" },
          { id: "operating_profit", label: "営業利益", value: metrics.operating_profit, color: "#42a846" }
        ];
        return {
          total: metrics.gross_profit,
          stages: [
            { label: "粗利益", nodes: [{ id: "gross_profit", label: "粗利益", value: metrics.gross_profit, color: "#53627a" }] },
            { label: "営業利益への分解", nodes: outputs }
          ],
          links: outputs.map(item => ({ from: [0, "gross_profit"], to: [1, item.id], value: item.value }))
        };
      }

      if (state.flowMode === "pretax_profit") {
        const nonOperatingGain = metrics.pretax_income - metrics.operating_profit;
        const attributionDifference = metrics.pretax_income - metrics.income_tax - metrics.net_profit;
        const inputs = [
          { id: "operating_profit", label: "営業利益", value: metrics.operating_profit, color: "#42a846" },
          { id: "non_operating_gain", label: "営業外純益", value: nonOperatingGain, color: "#59a6a6" }
        ];
        const outputs = [
          { id: "income_tax", label: "法人税等", value: metrics.income_tax, color: "#ca4b58" },
          { id: "attribution_difference", label: "帰属差・その他", value: attributionDifference, color: "#e69273" },
          { id: "net_profit", label: "当期純利益", value: metrics.net_profit, color: "#42a846" }
        ];
        return {
          total: metrics.pretax_income,
          stages: [
            { label: "税引前利益への流入", nodes: inputs },
            { label: "税引前利益", nodes: [{ id: "pretax", label: "税引前利益", value: metrics.pretax_income, color: "#53627a" }] },
            { label: "純利益への分解", nodes: outputs }
          ],
          links: [
            ...inputs.map(item => ({ from: [0, item.id], to: [1, "pretax"], value: item.value })),
            ...outputs.map(item => ({ from: [1, "pretax"], to: [2, item.id], value: item.value }))
          ]
        };
      }

      if (state.flowMode === "assets") {
        const assets = axis("assets");
        const funding = axis("liabilities_and_equity");
        const total = assets.total;
        return {
          total,
          stages: [
            { label: assets.label, nodes: assets.items.map((item, index) => ({ ...item, color: colors[index] })) },
            { label: "総資産", nodes: [{ id: "total_assets", label: "総資産", value: total, color: "#53627a" }] },
            { label: funding.label, nodes: funding.items.map((item, index) => ({ ...item, color: colors[index + 2] })) }
          ],
          links: [
            ...assets.items.map(item => ({ from: [0, item.id], to: [1, "total_assets"], value: item.value })),
            ...funding.items.map(item => ({ from: [1, "total_assets"], to: [2, item.id], value: item.value }))
          ]
        };
      }

      const geography = axis("geography");
      const business = axis("business");
      const pl = axis("pl");
      const leaves = Object.fromEntries(pl.items.map(item => [item.id, item]));
      const grossProfit = leaves.sga.value + leaves.research_and_development.value
        + leaves.operating_profit.value;
      let rightLabel = business.label;
      let rightNodes = business.items.map((item, index) => ({ ...item, color: colors[index] }));
      if (state.rightAxisMode === "pl_gross") {
        rightLabel = "PL構成（粗利益階層）";
        rightNodes = [
          { ...leaves.cost_of_sales, color: "#ca4b58" },
          { id: "gross_profit", label: "粗利益", value: grossProfit, color: "#42a846" }
        ];
      } else if (state.rightAxisMode === "pl_operating") {
        rightLabel = "PL構成（営業利益階層）";
        rightNodes = [
          { ...leaves.cost_of_sales, color: "#ca4b58" },
          { ...leaves.sga, color: "#d66a72" },
          { ...leaves.research_and_development, color: "#e69273" },
          { ...leaves.operating_profit, color: "#42a846" }
        ];
      }
      return {
        total: geography.total,
        stages: [
          { label: geography.label, nodes: geography.items.map((item, index) => ({ ...item, color: colors[index] })) },
          { label: "売上高", nodes: [{ id: "sales", label: "売上高", value: geography.total, color: "#53627a" }] },
          { label: rightLabel, nodes: rightNodes }
        ],
        links: [
          ...geography.items.map(item => ({ from: [0, item.id], to: [1, "sales"], value: item.value })),
          ...rightNodes.map(item => ({ from: [1, "sales"], to: [2, item.id], value: item.value }))
        ]
      };
    }

    function renderChart() {
      const host = document.querySelector("#chart");
      host.replaceChildren();
      if (!state.selected) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "表示できるデータがありません。";
        host.append(empty);
        return;
      }

      const flow = buildFlow();
      const width = Math.max(820, flow.stages.length * 280);
      const height = 590;
      const columnTop = 92;
      const columnHeight = 420;
      const columnWidth = 112;
      const nodeGap = 10;
      const edge = 50;
      const rightEdge = 190;
      const stageGap = (width - edge - rightEdge - columnWidth) / (flow.stages.length - 1);
      const maxGaps = Math.max(...flow.stages.map(stage => Math.max(0, stage.nodes.length - 1)));
      const scale = (columnHeight - maxGaps * nodeGap) / flow.total;
      const svg = svgElement("svg", {
        viewBox: `0 0 ${width} ${height}`,
        role: "img",
        "aria-label": `${state.selected.name} ${state.selected.metric} のSankeyグラフ`
      });

      const layouts = flow.stages.map((stage, stageIndex) => {
        const stageHeight = stage.nodes.reduce((sum, node) => sum + node.value * scale, 0)
          + Math.max(0, stage.nodes.length - 1) * nodeGap;
        let y = columnTop + (columnHeight - stageHeight) / 2;
        const nodes = stage.nodes.map(node => {
          const layout = {
            ...node, x: edge + stageIndex * stageGap, y,
            height: node.value * scale, sourceOffset: 0, targetOffset: 0
          };
          y += layout.height + nodeGap;
          return layout;
        });
        return { ...stage, nodes };
      });

      const findNode = ([stageIndex, id]) =>
        layouts[stageIndex].nodes.find(node => node.id === id);

      flow.links.forEach(link => {
        const source = findNode(link.from);
        const target = findNode(link.to);
        const thickness = link.value * scale;
        const sourceY = source.y + source.sourceOffset;
        const targetY = target.y + target.targetOffset;
        const sourceX = source.x + columnWidth;
        const targetX = target.x;
        const middleX = (sourceX + targetX) / 2;
        source.sourceOffset += thickness;
        target.targetOffset += thickness;
        const path = svgElement("path", {
          d: `M ${sourceX} ${sourceY}
              C ${middleX} ${sourceY}, ${middleX} ${targetY}, ${targetX} ${targetY}
              L ${targetX} ${targetY + thickness}
              C ${middleX} ${targetY + thickness}, ${middleX} ${sourceY + thickness}, ${sourceX} ${sourceY + thickness} Z`,
          fill: target.color ?? source.color,
          opacity: ".38"
        });
        const title = svgElement("title");
        title.textContent = `${source.label} → ${target.label}: ${number.format(link.value)}円`;
        path.append(title);
        svg.append(path);
      });

      layouts.forEach((stage, stageIndex) => {
        const x = edge + stageIndex * stageGap;
        addText(svg, x + columnWidth / 2, 30, stage.label, "axis-title", "middle");
        stage.nodes.forEach(item => {
          const rect = svgElement("rect", {
            x: item.x, y: item.y, width: columnWidth, height: Math.max(1, item.height),
            fill: item.color, stroke: "#fff", "stroke-width": 1.5, rx: 3
          });
          const title = svgElement("title");
          title.textContent = `${item.label}: ${number.format(item.value)}円`;
          rect.append(title);
          svg.append(rect);

          if (item.height >= 34) {
            addText(svg, item.x + 7, item.y + 15, item.label, "item-label");
            if (item.height >= 52) {
              addText(svg, item.x + 7, item.y + 30, formatValue(item.value), "item-value");
            }
          } else {
            addText(svg, item.x + columnWidth + 6, item.y + item.height / 2 + 4, item.label, "item-value");
          }
        });
      });

      host.append(svg);
    }

    function render() {
      renderAxisControls();
      renderChart();
    }

    function flowOptions(prototypeCase) {
      return prototypeCase.metric === "sales"
        ? [
            ["sales", "売上分解"],
            ["gross_profit", "粗利益 → 営業利益"],
            ["pretax_profit", "営業利益 → 税引前利益 → 純利益"]
          ]
        : [
            ["assets", "資産 → 負債・純資産"],
            ["equity", "純利益 → SS資本変動"],
            ["rd", "研究開発費 → セグメント"]
          ];
    }

    function selectCase(id) {
      state.selected = state.cases.find(item => item.id === id) ?? state.cases[0] ?? null;
      state.rightAxisMode = "business";
      const flowSelect = document.querySelector("#flow-select");
      flowSelect.replaceChildren();
      flowOptions(state.selected).forEach(([value, label]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        flowSelect.append(option);
      });
      state.flowMode = flowSelect.value;
      const meta = document.querySelector("#case-meta");
      meta.replaceChildren();
      if (state.selected) {
        const company = document.createElement("strong");
        company.textContent = `${state.selected.name}（${state.selected.code}）`;
        const period = document.createElement("span");
        period.textContent = `${state.selected.fy_end}・${state.selected.unit}`;
        meta.append(company, period);
      }
      render();
    }

    async function initialize() {
      try {
        const response = await fetch("./sankey_prototype_expected.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        state.cases = payload.cases ?? [];
        const select = document.querySelector("#case-select");
        state.cases.forEach(item => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.name;
          select.append(option);
        });
        select.addEventListener("change", event => selectCase(event.target.value));
        document.querySelector("#flow-select").addEventListener("change", event => {
          state.flowMode = event.target.value;
          render();
        });
        selectCase(select.value);
      } catch (error) {
        const host = document.querySelector("#chart");
        const message = document.createElement("div");
        message.className = "empty error";
        message.textContent = `JSONを読み込めませんでした。HTTPサーバー経由で開いてください。${error.message}`;
        host.replaceChildren(message);
      }
    }

    initialize();
  </script>
</body>
</html>
