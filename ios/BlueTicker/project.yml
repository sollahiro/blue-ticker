name: BlueTicker
options:
  bundleIdPrefix: com.sollahiro.blueticker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BlueTicker:
    type: application
    platform: iOS
    sources:
      - path: BlueTicker
    info:
      path: BlueTicker/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Blue Ticker
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sollahiro.blueticker.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BlueTickerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlueTickerTests
    dependencies:
      - target: BlueTicker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sollahiro.blueticker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BlueTicker:
    build:
      targets:
        BlueTicker: all
        BlueTickerTests: [test]
    test:
      targets:
        - BlueTickerTests
