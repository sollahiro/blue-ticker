# Fly.io デプロイ設定。blt-server を nrt（東京）で起動する。
# 実行時 env のデフォルトは Dockerfile に持たせている（self-host と共通）。
# ここでは Fly 固有の設定（Volume・VM）のみを定義する。
#
# 機密は fly secrets で注入する（イメージ・このファイルに焼かない）:
#   fly secrets set BLT_EDINET_API_KEY=... CF_ACCESS_TEAM_DOMAIN=... CLOUDFLARE_TUNNEL_TOKEN=... DATABASE_URL=...
#   fly secrets set BLT_FEED_TREND_URL=... BLT_FEED_TREND_TOKEN=...
# 手順は .agents/skills/deploy/SKILL.md を参照。Feed Trend 初回は scripts/feed-trend-ship.sh。
#
# 本番認証は Cloudflare Access（方式A・エッジ信頼）。到達は Cloudflare Tunnel 一本に絞る。
# そのため [http_service]（公開 LB・ポート 80/443）は置かない。公開ポートが開いていると
# origin が JWT 未検証（方式A）のまま素通りになるため、Phase 2 で撤去した（.agents/skills/deploy/SKILL.md）。
# サービスを持たないため Fly の auto-stop 対象から外れ、マシンは always-on になる
# （cloudflared が常時 outbound で Tunnel を維持するのに必須）。ヘルスは Tunnel + Access に委ねる。
# self-host（Tunnel なし）で公開ポートが必要な場合は [http_service] を復活させる。

app = "blt-server"             # グローバル一意。重複時は fly launch で変更する
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

# キャッシュ・設定の永続化（sync の真実源は Neon。これは EDINET 取得キャッシュ等）。
[[mounts]]
  source = "blt_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"             # serving 実測 RSS ~60MB。ingest はローカル（#34）
