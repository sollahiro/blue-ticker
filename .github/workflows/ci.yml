name: CI

# 配布 `ticker` / Homebrew release / 開発 CLI `TickerDev` は廃止済み。
# 検証対象は blt-server（唯一の product）とテストスイート、iOS クライアントの
# シミュレータ向けコンパイル、および fly.toml の serviceless 不変条件。
# デプロイは deploy.yml（CI 成功後）。
#
# 1 ジョブ 1 責務（docs/ci-checks.md）:
#   build-linux / build-macos  コンパイルだけ（テストは実行しない）
#   unit-tests                 golden 以外の Swift テスト（実 Postgres・読み取り専用ロールを含む）
#   golden-suite               golden と実 XBRL のスイート
#   ios-paths / ios / ios-packages  iOS アプリ本体と iOS 補助パッケージ（Apps/BlueTicker の変更時だけ）
#   static-checks              scripts/ci の検査とリポジトリ不変条件（数秒で終わるものを 1 runner に集める）
#   structure                  構造変更の通知（PR への書き込み権限を持つため分けておく）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    # Linux（Fly のイメージと同じ swift:6.1）で全ターゲットとテストターゲットがコンパイルできること。
    # テストは unit-tests / golden-suite が実行する。
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-linux-${{ hashFiles('Package.resolved') }}

      - name: Build
        # swift-nio 2.101.x の _NIOFileSystem が Linux で `import CSystem` を欠くため、
        # swift-nio が有効化する upcoming feature MemberImportVisibility (Swift 6.1+) 下で
        # st_ctim 等がエラー化する一時措置。詳細: .agents/rules/architecture.md / .agents/skills/deploy/SKILL.md
        run: swift build --build-tests -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility

  build-macos:
    # 本番 ingest は Mac で走るので、macOS でパッケージがビルドできることを確認する。
    # テストは実行しない（unit-tests / golden-suite / ios-packages が Linux で回す）。
    # SwiftPM の .build キャッシュは使わない。キーが Package.resolved ハッシュだけだと
    # エントリが凍り、復元成功後に `_NumericsShims` 欠落で落ちることがある
    # （同一キー swiftpm-macos-<hash>-miv1 の成功/失敗が混在）。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        # swift-nio 2.101.x が upcoming feature MemberImportVisibility を有効化する。
        # macOS では MCP 経由の EventSource が `_NumericsShims` を見失う（run 35600861476）。
        # swift-nio 修正までの一時措置。詳細: .agents/rules/architecture.md / .agents/skills/deploy/SKILL.md
        # `--build-tests` はテストを実行せず、テストターゲットのコンパイルまで見る。
        run: swift build --build-tests -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility

  ios-paths:
    # macos-26 を毎回起こさない。iOS アプリ本体と、このワークフロー（ios ジョブ定義）の
    # 変更だけを見る。docs やサーバー側 DTO はコンパイルに影響しないので対象外。
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PYEOF'
          import os
          import subprocess
          import sys

          FILES = frozenset({".github/workflows/ci.yml"})
          PREFIXES = ("Apps/BlueTicker/",)

          def relevant(path: str) -> bool:
              path = path.replace("\\", "/")
              return path in FILES or path.startswith(PREFIXES)

          def write(run: bool) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"run={'true' if run else 'false'}\n")
              print("ios job:", "run" if run else "skip")

          event = os.environ.get("EVENT", "")
          if event == "pull_request":
              base = os.environ.get("BASE_SHA", "")
          elif event == "push":
              base = os.environ.get("BEFORE_SHA", "")
              if not base or set(base) <= {"0"}:
                  print("push の before が無いため iOS ジョブを実行します")
                  write(True)
                  sys.exit(0)
          else:
              write(True)
              sys.exit(0)

          if not base:
              print("比較基点が空のため iOS ジョブを実行します")
              write(True)
              sys.exit(0)

          if subprocess.call(["git", "cat-file", "-e", f"{base}^{{commit}}"]) != 0:
              print(f"{base} を取得できないため iOS ジョブを実行します")
              write(True)
              sys.exit(0)

          diff = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", base, "HEAD"],
              text=True,
          )
          changed = [line for line in diff.splitlines() if line]
          hits = [path for path in changed if relevant(path)]
          for path in changed:
              print(f"{'*' if path in hits else ' '} {path}")
          write(bool(hits))
          PYEOF

  ios:
    # Apps/BlueTicker は SwiftPM 外。Cloud Agent の Linux VM では xcodebuild が無い。
    # サーバーの swift test とはジョブを分けて並列に回し、サーバー CI を遅らせない。
    # iOS 26 SDK は macos-26 イメージの既定 Xcode 26.6 に入っている。
    # テストターゲットはまだ無いのでシミュレータは起動せず、SDK 向けコンパイルだけ確認する。
    # シミュレータ不要の iOS Foundation 単体（Apps/BlueTicker 配下の SwiftPM パッケージ）は ios-packages が回す。
    # 署名はしない（CODE_SIGNING_ALLOWED=NO。プロジェクトの DEVELOPMENT_TEAM は実機用）。
    needs: ios-paths
    if: needs.ios-paths.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build BlueTicker for iOS Simulator
        working-directory: Apps/BlueTicker
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlueTicker.xcodeproj \
            -scheme BlueTicker \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --quieter

  unit-tests:
    # SQLite では検証できない Postgres 固有挙動（JSONB・索引・String PK）も同一ジョブの
    # サービスコンテナ Postgres 16 で回帰させる（.agents/skills/deploy/SKILL.md「Neon E2E」）。
    # PostgresIntegrationTests / ReadOnlyRolePostgresTests は BLT_TEST_POSTGRES_URL 設定時のみ実行される
    # 仕組みのため、別ジョブに分けると同じ Linux フルビルドが2回走るだけになる。統合して1回にする。
    # ReadOnlyRolePostgresTests は配信経路が SELECT だけのロールで動くこと（DDL・書き込みをしない）を見る。
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: blt
          POSTGRES_DB: blt
        options: >-
          --health-cmd "pg_isready -U postgres -d blt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-linux-${{ hashFiles('Package.resolved') }}

      - name: Test
        env:
          BLT_TEST_POSTGRES_URL: postgres://postgres:blt@postgres:5432/blt?sslmode=disable
        # swift-nio 2.101.x の _NIOFileSystem が Linux で `import CSystem` を欠くため、
        # swift-nio が有効化する upcoming feature MemberImportVisibility (Swift 6.1+) 下で
        # st_ctim 等がエラー化する。macOS も同フラグが無いと EventSource が
        # `_NumericsShims` を見失う（build-linux / build-macos と同じ一時措置）。
        # 詳細: .agents/rules/architecture.md / .agents/skills/deploy/SKILL.md
        #
        # 数分かかる XBRL スイートとハング緩和テストは同一プロセス並列だと
        # タイムアウト用 Task が遅延し、elapsed < 45 が Linux でも flake する
        # （run 32031247211: elapsed 160s）。加えて MCP の 200 秒打ち切りと
        # in-memory SQLite の接続分裂が起きる（run 32125967324）。テスト内容は維持する。
        #
        # ゴールデンスイート（SmokeTests / SegmentParityTests / *GoldenTests / Spec/Oracle/**）と
        # 実 XBRL を取得するスイート（SmokeCacheSupport.ensureCached を使うもの）は、必須チェック
        # `golden-suite` ジョブ（scripts/ci/golden-suite.sh、R2 → EDINET）で別プロセス実行する。
        # ここでは同じフィルタで skip して二重実行せず、XBRL も取りに行かない（docs/ci-checks.md）。
        run: |
          command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          GOLDEN_FILTER="$(scripts/ci/golden-suite.sh --print-filter)"
          swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility --skip StatelessTransportHangMitigationTests --skip "$GOLDEN_FILTER"
          swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility --filter StatelessTransportHangMitigationTests

  ios-packages:
    # iOS アプリの Foundation 単体（Apps/BlueTicker 配下の独立 SwiftPM パッケージ）のテスト。
    # サーバーのパッケージとは依存を共有しないので、iOS 側の変更時だけ回す（ios-paths と同じ判定）。
    needs: ios-paths
    if: needs.ios-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test HAPIS iOS consumer client
        working-directory: Apps/BlueTicker/HAPISConsumer
        run: swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility

      - name: Test iOS zero-axis fill helper
        working-directory: Apps/BlueTicker/ZeroAxisFill
        run: swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility

      - name: Test iOS fund look-through math
        working-directory: Apps/BlueTicker/FundMath
        run: swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility

      - name: Test iOS top feed RSS parsing
        working-directory: Apps/BlueTicker/FeedRSS
        run: swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility

      - name: Test iOS screen snapshot search
        working-directory: Apps/BlueTicker/ScreenSnapshot
        run: swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility

  # ---- 必須チェック（scripts/ci/*.sh。ローカルでも同じコマンドで実行できる。docs/ci-checks.md）
  golden-suite:
    # ゴールデン（smoke/smoke_expected + .checksums.json、smoke/*_expected.json、
    # *GoldenTests、Spec/Oracle/**）をフル実行。不一致は即失敗。
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-linux-${{ hashFiles('Package.resolved') }}

      - name: Golden suite
        env:
          BLT_EDINET_API_KEY: ${{ secrets.BLT_EDINET_API_KEY }}
          # 生 XBRL は R2（読み取り専用トークン）から先に取り、無い docID だけ EDINET へ。
          # CI は R2 へ書かない。secrets 未設定（fork 等）なら EDINET のみで動く。
          BLT_R2_ACCOUNT_ID: ${{ secrets.BLT_R2_ACCOUNT_ID }}
          BLT_R2_ACCESS_KEY_ID: ${{ secrets.BLT_R2_ACCESS_KEY_ID }}
          BLT_R2_SECRET_ACCESS_KEY: ${{ secrets.BLT_R2_SECRET_ACCESS_KEY }}
          BLT_R2_XBRL_BUCKET: blue-ticker-raw-xbrls
          # 取得できない golden 書類は SKIP ではなく失敗にする（SmokeCacheSupport.isStrict）。
          BLT_GOLDEN_STRICT: "1"
        run: |
          command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/ci/golden-suite.sh

  structure:
    # 構造変更ヒューリスティック。該当時は needs-architect ラベル + BLT_Architect webhook。
    # secrets 未設定なら警告のみで成功する。このジョブ自体は失敗させない。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Structure check
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          ARCHITECT_WEBHOOK_URL: ${{ secrets.ARCHITECT_WEBHOOK_URL }}
          ARCHITECT_WEBHOOK_AUTH: ${{ secrets.ARCHITECT_WEBHOOK_AUTH }}
        run: scripts/ci/structure.sh

  static-checks:
    # 数秒で終わるスクリプト検査とリポジトリ不変条件をまとめる（runner を 1 つだけ起こす）。
    # PR だけの検査（flags / golden-rules）はステップの if で絞る。前のステップが落ちても
    # 残りの検査は結果を出す（!cancelled()）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test scripts/ci
        # 各チェックを意図的に壊した diff とクリーンな diff で検証する。
        run: scripts/ci/tests/selftest.sh

      - name: Flags (new occurrences only, baseline may only shrink)
        # issuer 単位の contains 照合 / 全件 .all() / トラッカー ID・URL の「新規」追加を hard fail。
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/flags.sh

      - name: Golden checksums
        # ゴールデン変更時: 出典ノート / .checksums.json 更新 / 一括再生成の禁止。
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: scripts/ci/golden-suite.sh --checksums-only

      - name: Golden-change rules
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GOLDEN_BULK_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'golden-bulk-approved') }}
        run: scripts/ci/golden-rules.sh

      # ---- リポジトリ不変条件
      # 方式A（Cloudflare Access・エッジ信頼）は「Tunnel 経由限定 + 公開ポート閉鎖 + Access ポリシー」の
      # 3点セットで初めて成立する（.agents/skills/deploy/SKILL.md「Cloudflare Access」）。fly.toml に
      # [http_service] / [[services]]（＝公開 LB・ポート）が復活すると、この前提が崩れ
      # origin が無検証で素通りになる。TOML としてパースして判定する（コメント中の文字列
      # 一致による誤検知を避けるため。fly.toml 自身の警告コメントが `[http_service]` という
      # 文字列を含む）。
      # あわせて Package.swift の products が blt-server のみであることを検証する
      #（配布 ticker の再追加を防ぐ）。
      - name: Package products が blt-server のみであること
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYEOF'
          import pathlib
          import re
          import sys

          text = pathlib.Path("Package.swift").read_text()
          # products: [ ... ] をネスト深さで切り出す（targets: ["..."] の ] で途切れないようにする）
          m = re.search(r"products:\s*\[", text)
          if not m:
              print("Package.swift に products 配列が見つかりません", file=sys.stderr)
              sys.exit(1)
          start = m.end()
          depth = 1
          i = start
          while i < len(text) and depth:
              ch = text[i]
              if ch == "[":
                  depth += 1
              elif ch == "]":
                  depth -= 1
              i += 1
          if depth:
              print("Package.swift の products 配列が閉じられていません", file=sys.stderr)
              sys.exit(1)
          block = text[start : i - 1]
          # product 宣言の name: のみ拾う（targets 配列内のターゲット名は除外）
          names = re.findall(
              r"\.(?:executable|library|plugin)\(\s*name:\s*\"([^\"]+)\"",
              block,
          )
          if names != ["blt-server"]:
              print(
                  f"expected products=['blt-server'], got {names}. "
                  "配布 ticker は廃止済みです（docs/architecture.md）。",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("OK: Package.swift products =", names)
          PYEOF

      - name: fly.toml が serviceless を維持しているか検証
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYEOF'
          import sys
          import tomllib

          with open("fly.toml", "rb") as f:
              data = tomllib.load(f)

          offending = [k for k in ("http_service", "services") if k in data]
          if offending:
              print(
                  f"fly.toml に {offending} が定義されています。"
                  "方式A（Cloudflare Access・エッジ信頼）は公開ポート閉鎖が前提のため、"
                  "復活させる場合は .agents/skills/deploy/SKILL.md を確認してください。",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("OK: fly.toml は serviceless を維持しています")
          PYEOF

      - name: Feed Trend Worker の入力正規化
        if: ${{ !cancelled() }}
        run: node --test workers/feed-trend/src/validate.test.js

      - name: Feed RSS Worker の組み立てと fail closed
        if: ${{ !cancelled() }}
        run: node --test workers/feed-rss/src/rss.test.js workers/feed-rss/src/feed.test.js workers/feed-rss/src/parity.test.js workers/feed-rss/src/query.test.js

      - name: Legal Worker の経路
        if: ${{ !cancelled() }}
        run: node --test workers/legal/src/rewrite.test.js
