name: CI

# 配布 `ticker` / Homebrew release / 開発 CLI `TickerDev` は廃止済み。
# 検証対象は blt-server（唯一の product）とテストスイート、iOS クライアントの
# シミュレータ向けコンパイル、および fly.toml の serviceless 不変条件。
# デプロイは deploy.yml（CI 成功後）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-macos-${{ hashFiles('Package.resolved') }}

      - name: Test
        env:
          # スモークテスト（SmokeTests / SegmentParityTests）が不足 XBRL を EDINET から
          # 自動取得するための鍵。未設定（fork からの PR 等）では自動的に SKIP される。
          BLT_EDINET_API_KEY: ${{ secrets.BLT_EDINET_API_KEY }}
        # 数分かかる XBRL スイート（SmokeTests / SegmentParityTests）と、60秒の未完了
        # タスクを残すハング緩和テストを、残りの Vapor/SQLite テストと同一プロセスで
        # 並列実行しない。協調スレッドプールが飽和すると MCP の withOperationTimeout
        # が遅延し、DB テストが 200 秒タイムアウトや空の in-memory SQLite 接続を踏む
        # （run 32125967324: MCPRouteTests 500、FilingSectionsIngestTests purged=0）。
        # テスト内容は維持し、プロセスだけ分ける。
        run: |
          swift test --skip StatelessTransportHangMitigationTests --skip SmokeTests --skip SegmentParityTests
          swift test --filter 'SmokeTests|SegmentParityTests'
          swift test --filter StatelessTransportHangMitigationTests

  ios:
    # Apps/BlueTicker は SwiftPM 外。Cloud Agent の Linux VM では xcodebuild が無い。
    # サーバーの swift test とはジョブを分けて並列に回し、サーバー CI を遅らせない。
    # iOS 26 SDK は macos-26 イメージの既定 Xcode 26.6 に入っている。
    # テストターゲットはまだ無いのでシミュレータは起動せず、SDK 向けコンパイルだけ確認する。
    # 署名はしない（DEVELOPMENT_TEAM は空）。
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build BlueTicker for iOS Simulator
        working-directory: Apps/BlueTicker
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlueTicker.xcodeproj \
            -scheme BlueTicker \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --quieter

  swift-linux:
    # SQLite では検証できない Postgres 固有挙動（JSONB・索引・String PK）も同一ジョブの
    # サービスコンテナ Postgres 16 で回帰させる（.agents/skills/deploy/SKILL.md「Neon E2E」）。
    # PostgresIntegrationTests は BLT_TEST_POSTGRES_URL 設定時のみ実行される仕組みのため、
    # 別ジョブに分けると同じ Linux フルビルドが2回走るだけになる。統合して1回にする。
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: blt
          POSTGRES_DB: blt
        options: >-
          --health-cmd "pg_isready -U postgres -d blt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-linux-${{ hashFiles('Package.resolved') }}

      - name: Test
        env:
          BLT_TEST_POSTGRES_URL: postgres://postgres:blt@postgres:5432/blt?sslmode=disable
          # SmokeTests / RealXbrl* が不足 XBRL を EDINET から取得する（swift-macos と同じ）。
          # 未設定（fork からの PR 等）では自動的に SKIP される。
          BLT_EDINET_API_KEY: ${{ secrets.BLT_EDINET_API_KEY }}
        # swift-nio 2.101.x の _NIOFileSystem が Linux で `import CSystem` を欠くため、
        # swift-nio が有効化する upcoming feature MemberImportVisibility (Swift 6.1+) 下で
        # st_ctim 等がエラー化する（macOS は Darwin 経由で無傷）。swift-nio 修正までの一時措置。
        # 詳細: .agents/rules/architecture.md / .agents/skills/deploy/SKILL.md
        #
        # 数分かかる XBRL スイートとハング緩和テストは macOS と同じ理由で分離する。
        # 同一プロセス並列だとタイムアウト用 Task が遅延し、elapsed < 45 が Linux でも
        # flake する（run 32031247211: elapsed 160s）。加えて MCP の 200 秒打ち切りと
        # in-memory SQLite の接続分裂が起きる（run 32125967324）。テスト内容は維持する。
        run: |
          swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility --skip StatelessTransportHangMitigationTests --skip SmokeTests --skip SegmentParityTests
          swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility --filter 'SmokeTests|SegmentParityTests'
          swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility --filter StatelessTransportHangMitigationTests

  repo-invariants:
    # 方式A（Cloudflare Access・エッジ信頼）は「Tunnel 経由限定 + 公開ポート閉鎖 + Access ポリシー」の
    # 3点セットで初めて成立する（.agents/skills/deploy/SKILL.md「Cloudflare Access」）。fly.toml に
    # [http_service] / [[services]]（＝公開 LB・ポート）が復活すると、この前提が崩れ
    # origin が無検証で素通りになる。TOML としてパースして判定する（コメント中の文字列
    # 一致による誤検知を避けるため。fly.toml 自身の警告コメントが `[http_service]` という
    # 文字列を含む）。
    # あわせて Package.swift の products が blt-server のみであることを検証する
    #（配布 ticker の再追加を防ぐ。swift:6.1 コンテナに依存しない ubuntu ジョブへ置く）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package products が blt-server のみであること
        run: |
          python3 - <<'PYEOF'
          import pathlib
          import re
          import sys

          text = pathlib.Path("Package.swift").read_text()
          # products: [ ... ] をネスト深さで切り出す（targets: ["..."] の ] で途切れないようにする）
          m = re.search(r"products:\s*\[", text)
          if not m:
              print("Package.swift に products 配列が見つかりません", file=sys.stderr)
              sys.exit(1)
          start = m.end()
          depth = 1
          i = start
          while i < len(text) and depth:
              ch = text[i]
              if ch == "[":
                  depth += 1
              elif ch == "]":
                  depth -= 1
              i += 1
          if depth:
              print("Package.swift の products 配列が閉じられていません", file=sys.stderr)
              sys.exit(1)
          block = text[start : i - 1]
          # product 宣言の name: のみ拾う（targets 配列内のターゲット名は除外）
          names = re.findall(
              r"\.(?:executable|library|plugin)\(\s*name:\s*\"([^\"]+)\"",
              block,
          )
          if names != ["blt-server"]:
              print(
                  f"expected products=['blt-server'], got {names}. "
                  "配布 ticker は廃止済みです（docs/architecture.md）。",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("OK: Package.swift products =", names)
          PYEOF

      - name: fly.toml が serviceless を維持しているか検証
        run: |
          python3 - <<'PYEOF'
          import sys
          import tomllib

          with open("fly.toml", "rb") as f:
              data = tomllib.load(f)

          offending = [k for k in ("http_service", "services") if k in data]
          if offending:
              print(
                  f"fly.toml に {offending} が定義されています。"
                  "方式A（Cloudflare Access・エッジ信頼）は公開ポート閉鎖が前提のため、"
                  "復活させる場合は .agents/skills/deploy/SKILL.md を確認してください。",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("OK: fly.toml は serviceless を維持しています")
          PYEOF

      - name: Feed Trend Worker の入力正規化
        run: node --test workers/feed-trend/src/validate.test.js

      - name: Sankey smoke HTML のフロー保存
        run: node smoke/sankey_prototype_test.mjs
