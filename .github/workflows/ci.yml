name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-macos-${{ hashFiles('Package.resolved') }}

      - name: Test
        run: swift test

  swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-linux-${{ hashFiles('Package.resolved') }}

      - name: Test
        # swift-nio 2.101.x の _NIOFileSystem が Linux で `import CSystem` を欠くため、
        # swift-nio が有効化する upcoming feature MemberImportVisibility (Swift 6.1+) 下で
        # st_ctim 等がエラー化する（macOS は Darwin 経由で無傷）。swift-nio 修正までの一時措置。
        # 詳細: docs/blt-server-roadmap.md「Linux ビルドの既知の問題」
        run: swift test -Xswiftc -disable-upcoming-feature -Xswiftc MemberImportVisibility
