name: Legal page Worker

# App Store 用の免責・プライバシー・利用規約静的ページ（workers/legal）。
# api.* / mcp.* の前段には置かない。
#
# GitHub secrets（Feed Trend と同じ）:
#   CLOUDFLARE_API_TOKEN  Workers Scripts Edit
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths:
      - 'workers/legal/**'
      - '.github/workflows/legal-worker.yml'
  workflow_dispatch:

concurrency:
  group: legal-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: GitHub secrets の有無
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "未設定の GitHub secrets:$missing" >&2
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/legal
          wranglerVersion: "4"
