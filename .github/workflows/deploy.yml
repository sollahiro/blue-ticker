name: Deploy

# blt-server の唯一の出荷経路（配布 ticker / Homebrew の tag release は廃止済み）。
# CI（テスト）成功後にのみデプロイする。push 直結だとテストが落ちるコミットでも
# Docker ビルドさえ通れば本番へ出てしまうため、workflow_run で CI をゲートにする。
# workflow_run はパスフィルタ非対応のため、「前回成功した Deploy run の head_sha からの
# 差分にデプロイ関連パスが含まれるか」をジョブ内で判定する（スキップで終わった成功 run も
# 基準にしてよい: その run 自身が「基準〜その時点に関連差分なし」を検証済みのため）。
# 差分にマイグレーションが含まれる run は失敗で止める（Mac で migrate してから手動デプロイ）。
# `v*` タグ push では起動しない（旧 release.yml 相当の Homebrew 成果物は作らない）。
# run 名を「判定・デプロイした commit の sha」にする。workflow_run 起動の run は head_sha が
# 起動時点の main の HEAD になり、実際に checkout した commit と一致しない。次回の判定基準は
# head_sha ではなく、この run 名（display_title）から取る。
run-name: ${{ github.event.workflow_run.head_sha || github.sha }}
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # パス判定の誤りや手動再デプロイ用の逃げ道（パス判定をスキップして必ずデプロイする）
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # パス判定が過去の Deploy run を gh api で読むため
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          # CI が検証した commit を明示的に checkout する（workflow_run の checkout は
          # 既定でデフォルトブランチ最新を見るため、後続 push とのレースを避ける）。
          # workflow_dispatch では head_sha が空 = 起動時に選んだ ref を checkout する。
          ref: ${{ github.event.workflow_run.head_sha }}
          # パス判定で過去コミットとの diff を取るため全履歴が必要
          fetch-depth: 0

      - name: デプロイ関連パスの変更有無を判定
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: パス判定をスキップしてデプロイします"
            exit 0
          fi
          # gh api の一時障害では「デプロイする」側に倒す（デプロイは冪等・空 base 分岐へ）
          # 基準は run の head_sha ではなく run 名（= その run が checkout した commit の sha）。
          # workflow_run 起動の head_sha は起動時点の main の HEAD で、CI 中に次のマージがあると
          # 未デプロイの commit を「デプロイ済み」と誤判定する。run 名が sha でない旧 run は
          # 下の cat-file で弾かれ、デプロイする側に倒れる。
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].display_title // empty' 2>/dev/null || true)
          if ! printf '%s' "$base" | grep -qE '^[0-9a-f]{40}$'; then
            base=""
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "基準となる成功 run が見つからないためデプロイします"
            exit 0
          fi
          # 連続 push X→Y で CI(Y) が先に完了した後、遅れて CI(X) が完了するケースでは
          # HEAD(X) が base(Y) の祖先になる。diff には Y の巻き戻しが現れるが、古い X を
          # 上書きデプロイしてはならないためスキップする（同一 sha もここで弾く）。
          if git merge-base --is-ancestor HEAD "$base"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "HEAD は既にデプロイ済みの $base に含まれるためスキップします"
            exit 0
          fi
          # --no-renames: rename 検出時に旧パス（Sources/ からの移動元等）が出力から
          # 消えて取りこぼすのを防ぎ、両側を列挙させる
          changed_files=$(git diff --no-renames --name-only "$base" HEAD)
          # マイグレーションを含む変更は自動デプロイしない。blt-server は起動時に migrate しない
          # （読み取りロールで動く）ため、Mac で `blt-ingest migrate` を流す前に新しいサーバーが出ると
          # 未作成の列・表を読みに行く。失敗で止めるのは、この run を次回の基準（成功 run）にしないため
          # （成功扱いにすると、次の push でマイグレーションの差分が判定から消えて素通りする）。
          # 手順: Mac で migrate → Actions から Deploy を workflow_dispatch（docs/ingest-policy.md「出荷順」）。
          migrations=$(printf '%s\n' "$changed_files" | grep -E '^Sources/[^/]+/Migrations/' || true)
          if [ -n "$migrations" ]; then
            echo "::error::マイグレーションを含むため自動デプロイしません。Mac で blt-ingest migrate を実行してから、Deploy を workflow_dispatch で起動してください。"
            printf '%s\n' "$migrations"
            {
              echo "### 自動デプロイを止めました（マイグレーションあり）"
              echo
              echo "1. Mac で \`DATABASE_URL=\"\$BLT_NEON_WRITE_DATABASE_URL\" ./.build/release/blt-ingest migrate\`"
              echo "2. Actions の Deploy を workflow_dispatch で実行"
              echo
              printf '%s\n' "$migrations" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # blt-server イメージに入るものだけを見る（Dockerfile は blt-server だけをビルドし、
          # 実行ステージへ入れるのは scripts/entrypoint.sh と assets/EdinetcodeDlInfo.csv だけ）。
          # 取り込み側（Sources/BltIngest*・scripts/jp/ など）や taxonomy だけの変更ではデプロイしない。
          if printf '%s\n' "$changed_files" | \
             grep -qE '^(Sources/(BltServer|BltServerCore|BltStoreCore|BltMcpServerCore|BlueTicker)/|scripts/entrypoint\.sh$|assets/EdinetcodeDlInfo\.csv$|Dockerfile$|\.dockerignore$|fly\.toml$|Package\.swift$|Package\.resolved$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "デプロイ関連パスに変更なし（base=$base）"
          fi

      # FLY_API_TOKEN を扱うジョブのため mutable な @master 参照を避け、コミット SHA に固定する
      - uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4
        if: steps.paths.outputs.changed == 'true'

      - name: Deploy to Fly.io
        if: steps.paths.outputs.changed == 'true'
        # Depot リモートビルダが swift release の終盤で deadline_exceeded することがある
        #（run 36224321558: 950/952 で EOF）。同一コマンドを数回試し、最後は legacy builder。
        run: |
          set +e
          for attempt in 1 2 3; do
            if [ "$attempt" -lt 3 ]; then
              echo "flyctl deploy attempt ${attempt}/3 (Depot)"
              flyctl deploy --remote-only
            else
              echo "flyctl deploy attempt ${attempt}/3 (legacy builder, --depot=false)"
              flyctl deploy --remote-only --depot=false
            fi
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "deploy attempt ${attempt} failed with status ${status}"
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Ensure machine is running
        if: steps.paths.outputs.changed == 'true'
        # serviceless 構成（[http_service] 撤去済み・.agents/skills/deploy/SKILL.md）
        # のため、fly deploy 後にマシンが stopped のままになることがある（deploy skill「定常運用」）。
        # `flyctl machine status` に汎用 --json フラグは無いため、id/state を含む `machine list --json` のみで完結させる。
        run: |
          flyctl machine list --json | jq -c '.[]' | while read -r m; do
            id=$(echo "$m" | jq -r '.id')
            state=$(echo "$m" | jq -r '.state')
            if [ "$state" != "started" ]; then
              echo "machine $id is $state, starting..."
              flyctl machine start "$id"
            fi
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
