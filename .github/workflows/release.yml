name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-macos-${{ hashFiles('Package.resolved') }}

      - name: Test
        run: swift test

  release:
    needs: [check]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-macos-release-${{ hashFiles('Package.resolved') }}

      - name: Build CLI Binary
        run: swift build -c release --product ticker

      - name: Package Binary
        run: |
          mkdir -p release
          cp .build/release/ticker release/
          cp -R assets release/
          cd release
          COPYFILE_DISABLE=1 tar -czvf blue-ticker-macos-arm64.tar.gz ticker assets
        shell: bash

      - name: Verify Package Contents
        run: |
          test -f release/assets/EdinetcodeDlInfo.csv
          tar -tzf release/blue-ticker-macos-arm64.tar.gz | grep -qx "assets/EdinetcodeDlInfo.csv"
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/blue-ticker-macos-arm64.tar.gz

      - name: Calculate SHA256
        run: |
          SHA256=$(shasum -a 256 release/blue-ticker-macos-arm64.tar.gz | awk '{ print $1 }')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
        shell: bash

      - name: Update Homebrew Formula
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          SHA256=${{ env.SHA256 }}

          # Clone the tap repository
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/sollahiro/homebrew-blue-ticker.git homebrew-tap

          # Ensure Formula directory exists (handles empty repo)
          mkdir -p homebrew-tap/Formula

          # Update the formula file in the tap repo
          # We use the template from the main repo
          cat Formula/blue-ticker.rb | \
            sed "s|url \".*\"|url \"https://github.com/sollahiro/blue-ticker/releases/download/v${VERSION}/blue-ticker-macos-arm64.tar.gz\"|" | \
            sed "s|sha256 \".*\"|sha256 \"${SHA256}\"|" | \
            sed "s|version \".*\"|version \"${VERSION}\"|" > homebrew-tap/Formula/blue-ticker.rb

          rm -f homebrew-tap/Formula/mebuki.rb homebrew-tap/formula_renames.json

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update blue-ticker to v${VERSION}" || echo "No changes to commit"
          git branch -M main
          git push origin main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/blue-ticker-macos-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
